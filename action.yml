name: RemedyGraph audit
description: Run a bounded, read-only corrective-action audit in the checked-out repository.
author: RemedyGraph

inputs:
  postmortem:
    description: Repository-relative path to a UTF-8 Markdown or text postmortem.
    required: true
  repository:
    description: Repository directory to audit.
    required: false
    default: "."
  output:
    description: Repository-relative path for the minimized JSON report.
    required: false
    default: ".remedygraph/report.json"

outputs:
  report:
    description: Path to the generated JSON report.
    value: ${{ steps.audit.outputs.report }}

runs:
  using: composite
  steps:
    - name: Install RemedyGraph action
      shell: bash
      env:
        REMEDYGRAPH_ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install --disable-pip-version-check "$REMEDYGRAPH_ACTION_PATH"
    - id: audit
      name: Run bounded audit
      shell: bash
      env:
        REMEDYGRAPH_INPUT_OUTPUT: ${{ inputs.output }}
        REMEDYGRAPH_INPUT_POSTMORTEM: ${{ inputs.postmortem }}
        REMEDYGRAPH_INPUT_REPOSITORY: ${{ inputs.repository }}
      run: |
        set +e
        remedygraph-audit \
          --repository "$REMEDYGRAPH_INPUT_REPOSITORY" \
          --postmortem "$REMEDYGRAPH_INPUT_POSTMORTEM" \
          --output "$REMEDYGRAPH_INPUT_OUTPUT"
        status=$?
        echo "report=$REMEDYGRAPH_INPUT_OUTPUT" >> "$GITHUB_OUTPUT"
        exit "$status"

branding:
  icon: shield
  color: gray-dark
